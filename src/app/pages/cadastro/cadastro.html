<div class="container">
  <div class="card">
    <h1>Criar Conta</h1>
    <p class="subtitulo">Preencha seus dados para começar</p>

    <form (ngSubmit)="cadastrar()">
      <div class="cadastro">
        <label for="nome">Nome</label>
        <input
          id="nome"
          name="nome"
          type="text"
          [(ngModel)]="nome"
          (input)="validarNome($event)"
          placeholder="Nome Completo"
        />
      </div>

      <div class="cadastro">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          placeholder="Email"
        />
      </div>

      <div class="cadastro">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" [(ngModel)]="senha" placeholder="Senha" />
        <small class="dica">Deve ter no mínimo 6 caracteres</small>
      </div>

      @if (msgErro) {
        <p class="msg-erro">{{ msgErro }}</p>
      }

      <button type="submit" class="btn-primario">Salvar</button>
    </form>

    <p class="rodape">Já possui registro? <a routerLink="/login">Entrar</a></p>
  </div>
</div>
