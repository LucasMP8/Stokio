<div class="container">
  <div class="card">
    <h1>Bem vindo</h1>

    <form (ngSubmit)="entrar()">
      <div class="login">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          placeholder="email"
        />
      </div>

      <div class="login">
        <label for="senha">Senha</label>
        <input
          id="senha"
          name="senha"
          type="password"
          [(ngModel)]="senha"
          placeholder="senha"
        />
      </div>

      @if (msgErro) {
        <p class="msg-erro">{{ msgErro }}</p>
      }

      <button type="submit" class="btn-primario">Entrar</button>
    </form>

    <p class="rodape">Não possui registro? <a routerLink="/cadastro">Cadastrar</a></p>
  </div>
</div>
