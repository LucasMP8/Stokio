<div class="container">
  <section class="lado-logo">
    <img src="/images/stokio-logo.png" alt="Logo Stokio" class="logo-img" />
  </section>

  <section class="lado-form">
    <div class="form-wrapper">
      <header class="form-header">
        <h1>Bem-vindo</h1>
        <p class="subtitulo">Faça login para acessar sua conta</p>
      </header>

      <form [formGroup]="formularioLogin" (ngSubmit)="entrar()">
        <div class="campo">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="email"
            (input)="limparErroGeral()"
            [class.email-invalido]="emailFormatoInvalido()"
          />
          @if (campoVazio('email')) {
            <small class="erro-campo">O email precisa ser preenchido</small>
          } @else if (emailFormatoInvalido()) {
            <small class="erro-campo">Formato de e-mail inválido</small>
          }
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <input
            id="senha"
            type="password"
            formControlName="senha"
            placeholder="senha"
            (input)="limparErroGeral()"
          />
          @if (campoVazio('senha')) {
            <small class="erro-campo">A senha precisa ser preenchida.</small>
          }
        </div>

        @if (msgErro) {
          <p class="msg-erro">{{ msgErro }}</p>
        }

        <button type="submit" class="btn-primario">Entrar</button>
      </form>

      <p class="rodape">Não possui registro? <a routerLink="/cadastro">Cadastrar</a></p>
    </div>
  </section>
</div>
